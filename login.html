<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orbital News</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>
<body>
    <nav>
        <div class="main-nav container flex">
            <a href="index.html" class="company-logo">
                <img src="./Images/logo.png" alt="logo">
            </a>
            <div class="nav-links">
                <ul class="flex">
                    <li class="hover-link nav-item"><a href="index.html">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="container login-container">
            <h2>Login / Register</h2>
            <input type="text" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <input type="text" id="login-name" placeholder="Name (for Register)">
            <button class="search-button" id="login-button">Login</button>
            <button class="search-button" id="register-button">Register</button>
        </div>
    </main>
</body>
</html>
